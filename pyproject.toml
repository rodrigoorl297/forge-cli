[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "forge-cli"
version = "1.0.0"
description = "CLI para hash SHA-256 e resumo de JSON."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.3.0"]

[project.scripts]
forge-cli = "forge_cli.cli:main"

[tool.setuptools.packages.find]
include = ["forge_cli*"]
